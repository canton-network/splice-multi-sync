# The participants of the orgs that run nodes 1 to 5. Org 1's participant uses ports 60xx and org
# n's 6nxx. Unlike the validators' participants, they initialize their own identity.
_app_operator = ${_participant} {
  init {
    identity.type = auto
    generate-topology-transactions-and-keys = true
  }
  storage = ${_app_bft_storage}
}

canton.participants.app-operator = ${_app_operator} {
  storage.config.properties.databaseName = participant-app-operator
  monitoring {
    http-health-server.port = 6000
    grpc-health-server.port = 6061
  }
  http-ledger-api.port = 6075
  admin-api.port = 6002
  ledger-api.port = 6001
}

