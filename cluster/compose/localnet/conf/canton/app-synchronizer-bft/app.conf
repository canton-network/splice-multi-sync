# Four-node app-synchronizer on the BFT driver (-B). The app-sequencer runs as node 1, and nodes 2
# to 4 are bootstrapped with it at genesis. Node 5 comes up outside the synchronizer, for tests
# that onboard and remove a node. Peers are configured statically, so no discovery is needed.
#
# Each node belongs to its own org, whose participant hosts the sync operator party.

# The nodes below share LocalNet's Postgres, so they keep the small pools Splice's integration
# tests use.
_app_bft_storage = ${_storage} {
  parameters.max-connections = 8
}

_app_bft_network {
  server-endpoint {
    address = "0.0.0.0"
    external-address = "localhost"
    external-tls-config.enabled = false
  }
}

_app_bft_peer {
  address = "localhost"
  tls-config.enabled = false
}

_app_bft_sequencer {
  public-api.address = "0.0.0.0"
  admin-api.address = "0.0.0.0"
  monitoring.grpc-health-server.address = "0.0.0.0"
  sequencer {
    type = BFT
    config {
      consensus-empty-block-creation-timeout = 250ms
      initial-network = ${_app_bft_network}
    }
  }
}

_app_bft_mediator {
  admin-api.address = "0.0.0.0"
  monitoring.grpc-health-server.address = "0.0.0.0"
}

canton.sequencers.app-sequencer.sequencer {
  type = BFT
  config {
    consensus-empty-block-creation-timeout = 250ms
    initial-network = ${_app_bft_network} {
      server-endpoint {
        port = 5010
        external-port = 5010
      }
      peer-endpoints = [
        ${_app_bft_peer} { port = 5210 }
        ${_app_bft_peer} { port = 5310 }
        ${_app_bft_peer} { port = 5410 }
      ]
    }
  }
}

canton.sequencers.app-sequencer-2 = ${_app_bft_sequencer} {
  storage = ${_app_bft_storage} {
    config.properties {
      databaseName = "app-sequencer-2"
      currentSchema = "app-sequencer-2"
    }
  }
  public-api.port = 5218
  admin-api.port = 5219
  monitoring.grpc-health-server.port = 5272
  sequencer.config {
    storage = ${_app_bft_storage} {
      config.properties {
        databaseName = "app-sequencer-2"
        currentSchema = "app-sequencer-2-driver"
      }
    }
    initial-network {
      server-endpoint {
        port = 5210
        external-port = 5210
      }
      peer-endpoints = [
        ${_app_bft_peer} { port = 5010 }
        ${_app_bft_peer} { port = 5310 }
        ${_app_bft_peer} { port = 5410 }
      ]
    }
  }
}

canton.mediators.app-mediator-2 = ${_app_bft_mediator} {
  storage = ${_app_bft_storage} {
    config.properties {
      databaseName = "app-mediator-2"
      currentSchema = "app-mediator-2"
