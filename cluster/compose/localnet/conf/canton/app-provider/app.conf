canton.participants.app-provider = ${_participant} {
  storage.config.properties.databaseName = participant-app-provider
  monitoring {
    http-health-server.port = 3${CANTON_HTTP_HEALTHCHECK_PORT_SUFFIX}
    grpc-health-server.port= 3${CANTON_GRPC_HEALTHCHECK_PORT_SUFFIX}
  }
  http-ledger-api.port = 3${PARTICIPANT_JSON_API_PORT_SUFFIX}
  admin-api.port = 3${PARTICIPANT_ADMIN_API_PORT_SUFFIX}
  ledger-api.port = 3${PARTICIPANT_LEDGER_API_PORT_SUFFIX}
}

canton.sequencers.app-sequencer {

  storage = ${_storage} {
    config.properties {
      databaseName = "app-sequencer"
      currentSchema = "app-sequencer"
    }
  }

  public-api {
    address = "0.0.0.0"
    port = 5018
  }

  admin-api {
    address = "0.0.0.0"
    port = 5019
  }

  monitoring.grpc-health-server {
    address = "0.0.0.0"
    port = 5072
  }

  sequencer {
    config {
      storage = ${_storage} {
        config.properties {
          databaseName = "app-sequencer"
          currentSchema = "app-sequencer-driver"
        }
      }
    }
    type = reference
  }
}

canton.mediators.app-mediator {

  storage = ${_storage} {
    config.properties {
      databaseName = "app-mediator"
      currentSchema = "app-mediator"
    }
  }

  admin-api {
    address = "0.0.0.0"
    port = 5017
  }

  monitoring.grpc-health-server {
    address = "0.0.0.0"
    port = 5071
  }
}

# Successor of the app-synchronizer, for a logical synchronizer upgrade. Both nodes come up
# uninitialized: the sync operator initializes them from the predecessor's identity, which is what
# preserves the sequencer id validators are already connected to.
canton.sequencers.app-sequencer-successor {

  storage = ${_storage} {
    config.properties {
      databaseName = "app-sequencer-successor"
      currentSchema = "app-sequencer-successor"
    }
  }

  init {
    generate-topology-transactions-and-keys = false
    identity.type = manual
  }

  public-api {
    address = "0.0.0.0"
    port = 5118
  }

  admin-api {
    address = "0.0.0.0"
    port = 5119
  }

  monitoring.grpc-health-server {
    address = "0.0.0.0"
    port = 5172
  }

  sequencer {
    config {
      storage = ${_storage} {
        config.properties {
          databaseName = "app-sequencer-successor"
          currentSchema = "app-sequencer-successor-driver"
        }
      }
    }
    type = reference
  }
}

canton.mediators.app-mediator-successor {

  storage = ${_storage} {
    config.properties {
      databaseName = "app-mediator-successor"
      currentSchema = "app-mediator-successor"
    }
  }

  init {
    generate-topology-transactions-and-keys = false
    identity.type = manual
  }

  admin-api {
    address = "0.0.0.0"
    port = 5117
  }

  monitoring.grpc-health-server {
    address = "0.0.0.0"
    port = 5171
  }
}
