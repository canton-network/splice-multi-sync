canton.validator-apps.app-provider-validator_backend.app-instances.syncOperator {
  service-user = "sync-operator"
  dars = []
}

canton.sync-operator-apps.sync-operator {
  storage = ${_storage}
  storage.config.properties.databaseName = sync-operator
  storage.config.properties.currentSchema = sync-operator
  admin-api {
    address = "0.0.0.0"
    port = 3${SYNC_OPERATOR_ADMIN_API_PORT_SUFFIX}
  }
  operator-user = ${canton.validator-apps.app-provider-validator_backend.app-instances.syncOperator.service-user}
  participant-client = ${canton.validator-apps.app-provider-validator_backend.participant-client}
  scan-client.admin-api.url = ${?SPLICE_APP_VALIDATOR_SCAN_ADDRESS}
  synchronizer-nodes.current {
    sequencer {
      admin-api {
        address = canton
        port = 5019
      }
      internal-api {
        address = canton
        port = 5018
      }
      external-public-api-url = "http://canton:5018"
    }
    mediator.admin-api {
      address = canton
      port = 5017
    }
  }
  synchronizer-nodes.successor {
    sequencer {
      admin-api {
        address = canton
        port = 5119
      }
      internal-api {
        address = canton
        port = 5118
      }
      external-public-api-url = "http://canton:5118"
    }
    mediator.admin-api {
      address = canton
      port = 5117
    }
  }
  lsu-dump-path = "/domain-upgrade-dump/sync-operator-lsu-dump.json"
  # The operator writes these two files to schedule the upgrade. Until then nothing is scheduled.
  lsu {
    topology-freeze-time {
      type = timestamp-from-file
      file = "/app/sync-operator/on/lsu-topology-freeze-time"
    }
    upgrade-time {
      type = timestamp-from-file
      file = "/app/sync-operator/on/lsu-upgrade-time"
    }
    new-physical-synchronizer-serial = 2
    # The app-synchronizer is bootstrapped at the latest protocol version, and an upgrade may keep
    # it but never go back.
    new-physical-synchronizer-protocol-version = 36
  }
  base-traffic-amount = 0
  read-vs-write-scaling-factor = 200
  base-traffic-accumulation-duration = 10m
  free-confirmation-responses = false
}
