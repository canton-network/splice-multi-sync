    }
    parameters.max-connections = 8
  }
  participant-client {
    admin-api.port = 6302
    ledger-api.client-config.port = 6301
  }
  admin-api.port = 3925
  synchronizer-nodes.current.sequencer.admin-api.port = 5319
}

canton.sync-operator-apps.sync-operator-4 = ${canton.sync-operator-apps.sync-operator} {
