# One sync operator per node of the four-node app-synchronizer (-B), run by the node's org. Each
# copies the node 1 operator's config and points at its own org's participant and its own node's
# sequencer and mediator.

canton.sync-operator-apps.sync-operator {
  participant-client {
    admin-api.port = 6002
    ledger-api.client-config.port = 6001
  }
  # Upgrades are not supported on the four-node app-synchronizer yet, so no operator has a
  # successor.
  synchronizer-nodes.successor = null
  lsu = null
  lsu-dump-path = null
}

canton.sync-operator-apps.sync-operator-2 = ${canton.sync-operator-apps.sync-operator} {
  storage {
    config.properties {
      databaseName = sync-operator-2
      currentSchema = sync-operator-2
    }
    parameters.max-connections = 8
  }
  participant-client {
    admin-api.port = 6202
    ledger-api.client-config.port = 6201
  }
  admin-api.port = 3915
  synchronizer-nodes.current {
    sequencer {
      admin-api.port = 5219
      internal-api.port = 5218
      external-public-api-url = "http://canton:5218"
    }
    mediator.admin-api.port = 5217
  }
}

