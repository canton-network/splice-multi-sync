include required("include/canton-basic.conf")
canton {
  scan-app-clients {
    scanClient {
      admin-api.url = "http://scan.localhost:4000"
    }
  }
  sv-app-clients {
    svClient {
      admin-api {
        url = "http://sv.localhost:4000"
      }
    }
  }
  validator-app-clients {
    providerValidatorClient {
      admin-api {
        url = "http://wallet.localhost:3000"
      }
    }
  }
  remote-participants {
    app-provider {
      ledger-api {
        address = "grpc-ledger-api.localhost"
        port = 3000
      }
      admin-api {
        address = "localhost"
        port = 3902
      }
    }
  }
}
